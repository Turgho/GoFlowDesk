# docker-compose brings up only the PostgreSQL database. The API
# is executed locally with `go run ./cmd/api` (or via IDE); tests and
# seed scripts are also run locally.

services:
  postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-goflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-goflowdesk}
      POSTGRES_PORT: ${DB_PORT:-5432}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-goflow} -d ${DB_NAME:-goflowdesk} -h localhost -p ${DB_PORT:-5432}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
